---
layout: default
---
<article class="page post">
  <p class="breadcrumb"><a href="{{ '/blog/' | relative_url }}">&larr; Blog</a></p>
  <h1 class="page-title">{{ page.title }}</h1>
  <div class="post-meta">
    {{ page.date | date: '%B %-d, %Y' }}
    {%- assign words = content | strip_html | number_of_words -%}
    · {{ words | divided_by: 200 | at_least: 1 }} min read
    {%- if page.tags.size > 0 %} · {{ page.tags | join: ', ' }}{% endif %}
  </div>
  <div class="prose">
    {{ content }}
  </div>
</article>
